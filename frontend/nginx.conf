# ==================================================================
# 智法通前端 | Nginx 配置
# ------------------------------------------------------------------
# 要点：
#   1. SPA 路由回退（vue history 模式，任意路径回退 index.html）；
#   2. /api 反向代理到后端容器（zhifatong-backend:8000）；
#   3. SSE 流式支持：proxy_buffering off（token 级实时推送）；
#   4. 静态资源长缓存（vite hash 文件名）。
# ==================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（文本资源传输量降 70%）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- 静态资源：长缓存（文件名含 hash，内容变更自动换名）----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- API 反向代理 ----
    location /api/ {
        proxy_pass http://zhifatong-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 流式（/api/qa/ask/stream）：关闭缓冲 + 长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
