# ============================================================
# 智法通（ZhiFaTong）—— 企业级智能法律顾问平台
# Docker Compose 容器编排（Windows 11 + Docker Desktop）
# ============================================================
# 服务规划（V6.0 端口策略，避开本机常用端口冲突）：
#   mysql     : 宿主机 13306 -> 容器 3306   结构化数据存储
#   redis     : 宿主机 26379 -> 容器 6379   缓存 / 会话 / 限流
#   neo4j     : 宿主机 7474/7687            法律知识图谱（GraphRAG）
#   backend   : 宿主机 28000 -> 容器 8000   FastAPI 后端
#   frontend  : 宿主机 8188 -> 容器 80      Nginx + Vue3 前端
#
# 外部依赖（宿主机服务，容器内通过 host.docker.internal 访问）：
#   Ollama    : http://host.docker.internal:11434  (qwen2.5:1.5b + bge-large-zh-v1.5)
#   my-rerank : http://host.docker.internal:9999   (bge-reranker-v2-m3 精排服务)
# ============================================================

services:
  # ========== 结构化数据库 ==========
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/mysql:8.0
    container_name: zhifatong-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "zhifatong_root_2026"
      MYSQL_DATABASE: "zhifatong"
      TZ: Asia/Shanghai
    ports:
      - "13307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d   # 首次启动自动执行建表 SQL
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=500
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pzhifatong_root_2026"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - zhifatong-net

  # ========== 缓存与会话 ==========
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/redis:7-alpine
    container_name: zhifatong-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "26379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - zhifatong-net

  # ========== 法律知识图谱 ==========
  neo4j:
    image: neo4j:5-community
    container_name: zhifatong-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/Zhifa@Neo4j2025
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_server_default__advertised__address: localhost
    ports:
      - "7474:7474"   # HTTP（Neo4j Browser）
      - "7687:7687"   # Bolt 协议
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - zhifatong-net

  # ========== 后端 API 服务 ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zhifatong-backend:latest
    container_name: zhifatong-backend
    restart: unless-stopped
    environment:
      # ---- 运行模式（docker 容器内）----
      APP_ENV: docker
      # ---- 数据库连接（容器网络主机名）----
      MYSQL_HOST: zhifatong-mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: zhifatong_root_2026
      MYSQL_DATABASE: zhifatong
      REDIS_HOST: zhifatong-redis
      REDIS_PORT: "6379"
      # ---- 知识图谱 ----
      NEO4J_URI: bolt://zhifatong-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: Zhifa@Neo4j2025
      # ---- 宿主机 AI 服务（host.docker.internal 指向宿主机）----
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      RERANK_BASE_URL: http://host.docker.internal:9999
      # ---- LLM / Embedding 模型（3B 模型长文书生成质量显著优于 1.5B，
      #      避免出现 <[MASK_xxx]> 之类的退化乱码输出）----
      LLM_MODEL: qwen2.5:3b
      EMBEDDING_MODEL: quentinz/bge-large-zh-v1.5:latest
    ports:
      - "28000:8000"
    volumes:
      - backend_data:/app/data          # ChromaDB 向量库 + 上传合同持久化
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 兼容；Docker Desktop 自动生效
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - zhifatong-net

  # ========== 前端 Web 服务（Nginx） ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: zhifatong-frontend:latest
    container_name: zhifatong-frontend
    restart: unless-stopped
    ports:
      - "8188:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - zhifatong-net

volumes:
  mysql_data:
  redis_data:
  neo4j_data:
  backend_data:

networks:
  zhifatong-net:
    driver: bridge
